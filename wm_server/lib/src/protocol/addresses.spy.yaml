class: Addresses
table: addresses
fields:
    userId: int, relation(parent=users)
    label: String  # e.g. "Home", "Work", "Office"
    contactName: String  # recipient name
    contactPhone: String  # recipient phone
    street: String
    brgy: String
    city: String
    province: String
    postalCode: String
    country: String
    latitude: double?
    longitude: double?
    isPrimary: bool
    createdAt: DateTime
    updatedAt: DateTime
