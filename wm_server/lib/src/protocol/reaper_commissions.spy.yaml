class: ReaperCommission
table: reaper_commissions
fields:
    packageId: int, relation(parent=packages)
    level: int, relation(parent=levels)
    productId: int, relation(parent=products)
    netPerMember: double
    repeatOrderNet: double
    ronDescription: String?
    isActive: bool
    createdBy: String
    createdAt: DateTime
    updatedBy: String?
    updatedAt: DateTime?
