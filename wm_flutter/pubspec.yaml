name: wm_flutter
description: A new weMultiply Mobile Application.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  serverpod_flutter: 3.2.3
  wm_client:
    path: ../wm_client
  serverpod_auth_shared_flutter: 3.2.3
  serverpod_client: 3.2.3
  serverpod_auth_email_flutter: 3.2.3
  serverpod_auth_client: 3.2.3

  cupertino_icons: ^1.0.5
  icons_launcher: ^3.0.2
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  meta: ^1.16.0
  http: ^1.5.0
  intl: ^0.20.2
  google_fonts: ^6.3.1
  pretty_qr_code: ^3.5.0
  responsive_sizer: ^3.3.1
  carousel_slider: ^5.1.1
  flutter_svg: ^2.2.1
  circular_menu: ^4.0.0
  adaptive_platform_ui: ^0.1.4+1
  splash_master: ^0.0.3
  flutter_dotenv: ^6.0.0
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  url_launcher: ^6.2.5
  webview_flutter: ^4.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0



dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/pngs/
    - assets/svgs/

icons_launcher:
  image_path: "assets/pngs/logo3.png"
  platforms:
    android:
      enable: true
      adaptive_background_color: "#ffffff"
      adaptive_foreground_image: "assets/pngs/logo3.png"
    ios:
      enable: true
    web:
      enable: true
    windows:
      enable: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

splash_master:
  # Use to specifies the color for the splash screen
  color: '#FFFFFF'
  # Use to specifies the splash imag3
  image: 'assets/pngs/logo2.png'
  # Provides content mode for splash image in iOS
  # iOS content mode options: scaleToFill, scaleAspectFit, scaleAspectFill, redraw, center, top, bottom,
  # left, right, topLeft, topRight, bottomLeft, bottomRight.
  ios_content_mode: 'center'
  # Provides gravity for splash image in Android
  # Android gravity options: center, clip_horizontal, clip_vertical, fill_horizontal, fill, center_vertical, 
  # bottom, fill_vertical, center_horizontal, top, end, left, right, start
  android_gravity: 'center'
  # Use to specifies the splash image
  background_image: 'assets/pngs/background.png'
  # Provided content mode for splash image in background for iOS
  ios_background_content_mode: 'scaleToFill'
  # Provides gravity for background image in Android
  # Android gravity options: center, clip_horizontal, clip_vertical, fill_horizontal, fill, center_vertical, 
  # bottom, fill_vertical, center_horizontal, top, end, left, right, start
  android_background_image_gravity: 'fill'
  # Use to specifies image for android in dark mode
  image_dark_android: 'assets/pngs/logo.png'
  # Provides gravity for splash image for Android in dark mode
  android_dark_gravity_key: 'center'
  # Use to specifies the color for the splash screen for Android in dark mode
  color_dark_android: '#000000'
  # Section to specifies the configuration for the splash in Android 12+
  android_12_and_above:
    # Provides the background color of splash screen
    color: '#FFFFFF'
    # Provides custom icon to replace the default app icon
    image: 'assets/pngs/logo3.png'
    # Provides branding image which is shown under main icon image. 
    # branding_image: 'assets/pngs/logo.png'